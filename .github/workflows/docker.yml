name: Docker image

# Runs only when a GitHub release is published (every release carries a tag).
# Kept small for the 2000 min/month free tier:
# - a single job (billing rounds each job up to a full minute)
# - layers are cached in GHCR, so a code-only release skips pnpm install
on:
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Registry references must be lowercase; the org name (SADCAIVibe) is not.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache instead of the GitHub Actions cache: Actions caches created on a
          # tag are only visible to that same tag, so every release would build cold.
          # mode=max also caches the dependencies/builder stages, not just the final image.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # Auto-deploy: every app in argocd-deployments running this image (any
      # cluster) is pointed at the new tag; Argo CD rolls it out within ~3 min.
      # Pre-releases build an image but don't deploy.
      - name: Deploy via argocd-deployments
        if: ${{ !github.event.release.prerelease }}
        env:
          # Write-enabled deploy key of SADCAIVibe/argocd-deployments.
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::GITOPS_DEPLOY_KEY not set; image built but not deployed"
            exit 0
          fi
          key="$RUNNER_TEMP/gitops_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:SADCAIVibe/argocd-deployments.git "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"

          apps=""
          for f in clusters/*/apps/*/values.yaml; do
            grep -qx "  repository: $IMAGE" "$f" || continue
            sed -i -E "/^image:/,/^[^ ]/ s/^(  tag: ).*/\1\"$TAG\"/" "$f"
            apps="$apps $(echo "$f" | cut -d/ -f2,4)"
          done
          [ -n "$apps" ] || { echo "::warning::no app in argocd-deployments uses $IMAGE"; exit 0; }
          git diff --quiet && { echo "already at $TAG:$apps"; exit 0; }

          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qam "${GITHUB_REPOSITORY#*/}: deploy $TAG to$apps" \
            -m "Release: ${{ github.event.release.html_url }}"
          # Another repo may have pushed meanwhile.
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase -q
          done
          echo "::notice::deployed $TAG to$apps"
